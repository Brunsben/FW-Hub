# Cloudflare schickt die echte Client-IP und Proto
# $scheme ist intern immer http — wir nutzen den Header von Cloudflare
map $http_x_forwarded_proto $real_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 8080 default_server;
    server_name portal.example.org _;
    server_tokens off;

    # ── Gzip-Kompression ──────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # ── Proxy-Defaults ───────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering       on;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;

    # ── Echte Client-IP (Details: drizzle/manual/login-sperre.md) ──────────
    # nginx übernimmt CF-Connecting-IP NUR, wenn die direkte Gegenstelle in einer
    # der set_real_ip_from-Zeilen steht. Jede Zeile hier ist eine Vertrauens-
    # entscheidung. Hinweis: Eine Liste in einem server-Block ersetzt die
    # real_ip-Angaben aus conf.d/ratelimit.conf, sie wird nicht ergänzt.
    #
    # 1) Cloudflare Tunnel (Betrieb auf dem Server): cloudflared läuft als
    #    Host-Dienst und verbindet auf http://127.0.0.1:8180. Docker zeigt nginx
    #    diese Verbindung mit der Gateway-Adresse des Docker-Netzes (hier
    #    172.18.0.1, mit `docker network inspect` prüfen). Nur dank dieser Zeile
    #    kommt die echte Client-IP an. Das ist vertretbar, WEIL der nginx-Port nur
    #    auf 127.0.0.1 gebunden ist (docker-compose: "127.0.0.1:8180:8080"), von
    #    dort also nur Prozesse des Hosts verbinden können. Wird der Port wieder
    #    auf 0.0.0.0 gebunden, kann jeder im LAN/Internet über das Gateway
    #    CF-Connecting-IP fälschen und die IP-Sperre umgehen.
    set_real_ip_from 172.18.0.1;

    # 2) Direkter Proxy-Betrieb (orange Wolke, Port von Cloudflare erreichbar):
    #    Nur dann sind die Cloudflare-Netze relevant. Im Tunnel-Betrieb kommen
    #    keine Verbindungen aus diesen Netzen, die Zeilen schaden dort nicht.
    #    Quelle: https://www.cloudflare.com/ips-v4 und /ips-v6 (Stand 08.11.2026,
    #    bei Änderungen dort nachziehen).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Security-Headers ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Next.js benötigt 'unsafe-inline' für RSC-Payloads und Hydration
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # ── Custom Error-Pages ────────────────────────────────
    error_page 502 503 504 /error-backend.html;
    location = /error-backend.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Portal (Next.js) ──────────────────────────────────
    # Alle Portal-Seiten und API-Routes werden an Next.js durchgereicht
    location / {
        set $portal_upstream http://portal:8080;
        proxy_pass $portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
    }

    # ── Auth API (Rate-Limited) ───────────────────────────
    location ^~ /api/auth/ {
        limit_req zone=api burst=10 nodelay;
        set $portal_upstream http://portal:8080;
        proxy_pass $portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_http_version 1.1;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    }

    # Docker-interner DNS-Resolver (damit optionale Upstreams nicht beim Start crashen)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Führerscheinkontrolle (/fk/) ─────────────────────
    # Wird jetzt direkt vom Portal bedient (location / fängt alles ab)

    # ── Health-Endpoint (für Uptime-Kuma / Monitoring) ────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
